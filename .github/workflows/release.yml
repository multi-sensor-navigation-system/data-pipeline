name: Release

# Pushing a tag like v0.2.0 builds the package and publishes a GitHub Release
# with the wheel and sdist attached. The tag must match the version in
# src/navkit/__init__.py.
#
# PyPI: set the repository variable PYPI_PUBLISH=true after registering this
# workflow as a trusted publisher for the `navkit` project on pypi.org
# (Publishing → Add a new pending publisher: this repo, workflow release.yml,
# environment "pypi").

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the tag matches the package version
        run: |
          version="$(ls dist/*.tar.gz | sed -E 's/.*navkit-(.*)\.tar\.gz/\1/')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "navkit $GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
